# Servidor estático do perfil "prod": serve apps/web/dist (montado) com
# fallback de SPA. Os headers de segurança vêm do edge (default.conf.template).
# Cache (R10): o que diz qual é a versão atual (SW, manifest, index.html) é
# revalidado sempre; assets/ tem hash no nome e é imutável.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache";
  }

  # o mime.types do nginx 1.27 não conhece .webmanifest (sairia octet-stream)
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # também atende o fallback de SPA abaixo (try_files → /index.html)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
