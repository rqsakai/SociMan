# SociMan — stack local. Topologia herdada do volans: um único domínio público
# (edge nginx) roteando /api/* → API (FastAPI), /img/* → imgproxy e /* → SPA.
#
#   docker compose up                       # dev (Vite HMR + uvicorn --reload)
#   npm run build && EDGE_MODE=prod docker compose --profile prod up   # build estático + CSP ESTRITA
#
# Publicados: edge (8180/8543) e console do MinIO (9101). Postgres, API e
# imgproxy ficam só na rede interna — tudo passa pela borda.
# Credenciais abaixo são SÓ de desenvolvimento local.

name: sociman

services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_PORT:-8180}:8080"
      - "${EDGE_TLS_PORT:-8543}:8443"
    environment:
      EDGE_MODE: ${EDGE_MODE:-dev}
      LAN_HOST: ${LAN_HOST:-192.168.86.47}   # HTTP por esse IP → HTTPS (spec 002-pwa)
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/05-edge-mode.envsh:/docker-entrypoint.d/05-edge-mode.envsh:ro
      - ./docker/certs:/etc/nginx/certs:ro
      # SÓ a parte pública da CA da casa (./scripts/certs-casa.sh), servida por HTTP.
      # Sem o script, o Docker cria estes caminhos como pastas vazias; o script
      # as remove antes de gerar os arquivos.
      - ./docker/certs/ca/sociman-ca.crt:/usr/share/nginx/ca/sociman-ca.crt:ro
      - ./docker/certs/ca/sociman-ca.cer:/usr/share/nginx/ca/sociman-ca.cer:ro
    depends_on:
      api:
        condition: service_started
      certgen:
        condition: service_completed_successfully

  certgen:
    image: alpine/openssl:latest
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -c
      - >
        test -f /certs/localhost.pem ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825
        -keyout /certs/localhost-key.pem -out /certs/localhost.pem
        -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - ./docker/certs:/certs

  api:
    build: ./apps/api
    user: "1000:1000"   # arquivos no bind mount ficam do usuário do host
    env_file: .env.docker
    environment:
      SOCIMAN_RELOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /tmp/uv-cache   # UID 1000 não tem HOME gravável no container
      UV_NO_SYNC: "1"               # o venv (/opt/venv) já vem pronto da imagem
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}     # opcionais (.env da raiz, gitignored): URLs /img assinadas
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      # HD de dados (spec 004, R5). SOCIMAN_DATA_DIR precisa ficar dentro de /media/sakai.
      SOCIMAN_DATA_DIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}
      DATA_MIN_FREE_GB: ${DATA_MIN_FREE_GB:-20}
      TMPDIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}/work/tmp   # spool de upload
      # Spec 006 (R15): chaves no .env da raiz (gitignored); vazias = integração não configurada.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENSHORTS_URL: ${OPENSHORTS_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # OpenShorts roda no host (:8000)
    volumes:
      - ./apps/api:/app   # código ao vivo; o venv fica em /opt/venv na imagem
      # O pai do ponto de montagem, no mesmo caminho: a API sobe sem o HD (e nunca cria a pasta
      # de dados); com rslave, montar ou desmontar o HD no host aparece aqui sem reiniciar.
      - type: bind
        source: /media/sakai
        target: /media/sakai
        bind:
          create_host_path: false
          propagation: rslave
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Fila de cortes (spec 004, R1): a mesma imagem da API rodando `sociman worker`, um corte por
  # vez. Mesmos env e binds da API: o HD em /media/sakai com rslave (sem o sentinela o worker não
  # pega nada e espera) e a pasta de trabalho em ${SOCIMAN_DATA_DIR}/work/cortes/{id}.
  worker:
    build: ./apps/api
    image: sociman-api   # a mesma tag do serviço api: um build serve os dois
    user: "1000:1000"
    command: ["sociman", "worker"]
    env_file: .env.docker
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /tmp/uv-cache
      UV_NO_SYNC: "1"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      SOCIMAN_DATA_DIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}
      DATA_MIN_FREE_GB: ${DATA_MIN_FREE_GB:-20}
      TMPDIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}/work/tmp
    volumes:
      - ./apps/api:/app
      - type: bind
        source: /media/sakai
        target: /media/sakai
        bind:
          create_host_path: false
          propagation: rslave
    # SIGTERM devolve o corte em andamento à fila (sem contar tentativa) antes de sair.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Tarefas periódicas (spec 006, R1): a mesma imagem da API rodando `sociman agendador`, com as
  # trilhas sync (YouTube), openshorts, importacao e lembretes. Um advisory lock do Postgres
  # garante uma instância ativa. Sem as chaves, sobe e fica ociosa (log claro). Sem porta.
  agendador:
    build: ./apps/api
    image: sociman-api
    user: "1000:1000"
    command: ["sociman", "agendador"]
    env_file: .env.docker
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /tmp/uv-cache
      UV_NO_SYNC: "1"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      SOCIMAN_DATA_DIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}
      DATA_MIN_FREE_GB: ${DATA_MIN_FREE_GB:-20}
      TMPDIR: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}/work/tmp
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENSHORTS_URL: ${OPENSHORTS_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api:/app
      - type: bind
        source: /media/sakai
        target: /media/sakai
        bind:
          create_host_path: false
          propagation: rslave
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /repo
    user: "1000:1000"
    environment:
      HOME: /tmp
      VITE_CACHE_DIR: /tmp/vite-cache
    volumes:
      - .:/repo
    command: ["npm", "run", "dev", "-w", "@sociman/web", "--", "--host"]

  web-prod:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/web-prod.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sociman
      POSTGRES_PASSWORD: sociman
      POSTGRES_DB: sociman
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro   # cria sociman_test (só em volume novo)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociman -d sociman"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Sessões de login e limites de tentativa (efêmero; AOF para sobreviver a restart). Sem porta no host.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # E-mail SÓ de dev: captura tudo que a API envia. UI em http://127.0.0.1:8126
  # (8025/1025 do host são do arka-manager). SMTP 1025 só na rede interna.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8126}:8025"

  # Mídia (logos, banners, fontes, vídeos) — S3-compatível. Os dados ficam no HD (spec 004, R5):
  # sem o HD montado (ou sem o sentinela) os binds falham e o container não sobe; o entrypoint
  # ainda confere o sentinela. Nunca grava no NVMe.
  # Tag fixa: a mesma versão que gravou os dados migrados do volume minio-data (R12).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -c
      - >
        test -f /sentinela/.sociman-volume ||
        { echo "ERRO: /sentinela/.sociman-volume não existe: o HD de dados não está montado (scripts/data-setup.sh check)" >&2; exit 1; };
        exec minio server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - type: bind
        source: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}/minio
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${SOCIMAN_DATA_DIR:-/media/sakai/BACKUP/tiktok/sociman}/.sociman-volume
        target: /sentinela/.sociman-volume
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/sociman local/sociman-fonts local/sociman-videos

  # Thumbnails/redimensionamento on-the-fly em /img/* — fontes RESTRITAS ao bucket
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # + miniaturas e avatares do YouTube (spec 006, R13): lista fechada, a CSP não muda.
      IMGPROXY_ALLOWED_SOURCES: "s3://sociman/,https://i.ytimg.com/,https://yt3.ggpht.com/,https://yt3.googleusercontent.com/"
      # Biblioteca de assets (spec 007, R3): até 20 MB por imagem; 40 MP cobre 2048×2048 com folga.
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  # SEM USO desde a spec 004 (os dados foram para o HD). É a cópia de segurança da migração e só
  # o dono o remove, à mão. `external` impede que `down -v` o apague (volume interno seria apagado).
  minio-data:
    external: true
    name: sociman_minio-data
  redis-data:
