# SociMan — stack local. Topologia herdada do volans: um único domínio público
# (edge nginx) roteando /api/* → API (FastAPI), /img/* → imgproxy e /* → SPA.
#
#   docker compose up                       # dev (Vite HMR + uvicorn --reload)
#   npm run build && EDGE_MODE=prod docker compose --profile prod up   # build estático + CSP ESTRITA
#
# Publicados: edge (8180/8543) e console do MinIO (9101). Postgres, API e
# imgproxy ficam só na rede interna — tudo passa pela borda.
# Credenciais abaixo são SÓ de desenvolvimento local.

name: sociman

services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_PORT:-8180}:8080"
      - "${EDGE_TLS_PORT:-8543}:8443"
    environment:
      EDGE_MODE: ${EDGE_MODE:-dev}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/05-edge-mode.envsh:/docker-entrypoint.d/05-edge-mode.envsh:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      certgen:
        condition: service_completed_successfully

  certgen:
    image: alpine/openssl:latest
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -c
      - >
        test -f /certs/localhost.pem ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825
        -keyout /certs/localhost-key.pem -out /certs/localhost.pem
        -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - ./docker/certs:/certs

  api:
    build: ./apps/api
    user: "1000:1000"   # arquivos no bind mount ficam do usuário do host
    env_file: .env.docker
    environment:
      SOCIMAN_RELOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/api:/app   # código ao vivo; o venv fica em /opt/venv na imagem
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /repo
    user: "1000:1000"
    environment:
      HOME: /tmp
      VITE_CACHE_DIR: /tmp/vite-cache
    volumes:
      - .:/repo
    command: ["npm", "run", "dev", "-w", "@sociman/web", "--", "--host"]

  web-prod:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/web-prod.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sociman
      POSTGRES_PASSWORD: sociman
      POSTGRES_DB: sociman
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociman -d sociman"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Mídia (logos, banners, avatares, poses, cenas) — S3-compatível
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/sociman

  # Thumbnails/redimensionamento on-the-fly em /img/* — fontes RESTRITAS ao bucket
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      IMGPROXY_ALLOWED_SOURCES: "s3://sociman/"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
