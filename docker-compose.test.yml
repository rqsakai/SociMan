# SociMan — stack EFÊMERA dos testes da API. Não use direto: rode `npm run test:api`
# (ou ./scripts/test-api.sh), que sobe tudo com um nome de projeto único e SEMPRE
# derruba com `down -v` (containers, rede e volumes apagados) ao terminar.
#
# Nada de porta publicada no host, nada de volume nomeado: Postgres e MinIO gravam em
# tmpfs e o Redis roda sem persistência. Credenciais SÓ de teste (sobrescreva por variável).
# O "HD de dados" (SOCIMAN_DATA_DIR, spec 004) também é um tmpfs, com o sentinela criado no
# entrypoint do pytest: os testes nunca tocam no HD real.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_PG_USER:-sociman_test}
      POSTGRES_PASSWORD: ${TEST_PG_PASSWORD:-sociman_test}
      POSTGRES_DB: ${TEST_PG_DB:-sociman_test}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e   # a mesma do dev
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TEST_S3_ACCESS_KEY:-sociman-test}
      MINIO_ROOT_PASSWORD: ${TEST_S3_SECRET_KEY:-sociman-test-secret}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    environment:
      MC_USER: ${TEST_S3_ACCESS_KEY:-sociman-test}
      MC_PASSWORD: ${TEST_S3_SECRET_KEY:-sociman-test-secret}
      MC_BUCKET: ${TEST_S3_BUCKET:-sociman-test}
      MC_FONTS_BUCKET: ${TEST_S3_FONTS_BUCKET:-sociman-fonts-test}
      MC_VIDEOS_BUCKET: ${TEST_S3_VIDEOS_BUCKET:-sociman-videos-test}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set t http://minio:9000 "$$MC_USER" "$$MC_PASSWORD" &&
        mc mb -p "t/$$MC_BUCKET" "t/$$MC_FONTS_BUCKET" "t/$$MC_VIDEOS_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  pytest:
    build: ./apps/api
    # Tag fixa: execuções em paralelo reaproveitam a mesma imagem (o `down` não a apaga).
    image: sociman-api-test:latest
    user: "1000:1000"   # arquivos no bind mount ficam do usuário do host
    working_dir: /app
    environment:
      ENV: test
      DATABASE_URL: &db-url postgresql+psycopg://${TEST_PG_USER:-sociman_test}:${TEST_PG_PASSWORD:-sociman_test}@postgres:5432/${TEST_PG_DB:-sociman_test}
      TEST_DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${TEST_S3_ACCESS_KEY:-sociman-test}
      S3_SECRET_KEY: ${TEST_S3_SECRET_KEY:-sociman-test-secret}
      S3_BUCKET: ${TEST_S3_BUCKET:-sociman-test}
      TEST_S3_BUCKET: ${TEST_S3_BUCKET:-sociman-test}
      S3_FONTS_BUCKET: &fonts-bucket ${TEST_S3_FONTS_BUCKET:-sociman-fonts-test}
      TEST_S3_FONTS_BUCKET: *fonts-bucket
      S3_VIDEOS_BUCKET: &videos-bucket ${TEST_S3_VIDEOS_BUCKET:-sociman-videos-test}
      TEST_S3_VIDEOS_BUCKET: *videos-bucket
      # HD de dados de mentira (tmpfs abaixo); piso baixo porque o tmpfs é pequeno.
      SOCIMAN_DATA_DIR: /srv/sociman-data
      DATA_MIN_FREE_GB: "0.01"
      TMPDIR: /srv/sociman-data/work/tmp
      # Fixo e público: só assina tokens da stack efêmera (não é segredo).
      JWT_SECRET: ${TEST_JWT_SECRET:-teste-efemero-nao-e-segredo-0123456789abcdef}
      # Spec 015: chave FIXA de teste (base64url de um texto óbvio; está na lista de valores
      # permitidos do check:secrets) e publicação desligada (os testes ligam por override).
      SOCIMAN_TOKENS_KEY: dGVzdGUtZWZlbWVyby1jaGF2ZS1kby10b2tlbi0zMmI=
      PUBLICACAO_HABILITADA: "false"
      # Spec 009: MCP desligado no servidor (os testes ligam por override de Settings).
      MCP_HABILITADO: "false"
      # Spec 016: coleta ligada (os testes desligam por override de Settings).
      METRICAS_COLETA_HABILITADA: "true"
      # Os testes usam MemoryEmailSender; um host inexistente faz qualquer envio real falhar.
      SMTP_HOST: smtp.invalido.test
      SMTP_PORT: "1025"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /tmp/uv-cache   # UID 1000 não tem HOME gravável no container
      UV_NO_SYNC: "1"               # o venv (/opt/venv) já vem pronto da imagem
    volumes:
      - ./apps/api:/app   # código ao vivo; o venv fica em /opt/venv na imagem
    tmpfs:
      - /srv/sociman-data:uid=1000,gid=1000,mode=0755
    # Monta o "HD" (sentinela e work/) antes de qualquer comando, inclusive o do test-api.sh.
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p "$$SOCIMAN_DATA_DIR/work/tmp" "$$SOCIMAN_DATA_DIR/work/cortes" &&
        echo teste > "$$SOCIMAN_DATA_DIR/.sociman-volume" &&
        exec "$$@"
      - sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["uv", "run", "pytest"]
