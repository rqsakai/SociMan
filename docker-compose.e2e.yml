# SociMan — stack EFÊMERA dos e2e (Playwright). Não use direto: rode `npm run test:e2e`
# (ou `npm run test:e2e:pwa`), que sobe tudo como projeto `sociman-e2e` e SEMPRE derruba
# com `down -v` (containers, rede e volumes apagados) ao terminar. A stack de dev (projeto
# `sociman`) nunca é tocada: outro projeto, outra rede, outros volumes, outras portas.
#
# Publicados no host, só em 127.0.0.1: edge (8280 http / 8643 https) e UI do Mailpit (8127).
# Postgres e MinIO gravam em tmpfs, o Redis roda sem persistência e o "HD de dados" é um
# volume tmpfs com o sentinela criado no comando da API e do worker. Credenciais SÓ de teste.
#
# Perfis: `dev` (Vite dev atrás do edge, EDGE_MODE=dev) e `pwa` (build estático em
# E2E_WEB_DIST servido pelo web-prod, EDGE_MODE=prod). O scripts/test-e2e.sh escolhe um.

x-api-env: &api-env
  ENV: development   # reset-db/create-owner da CLI recusam produção
  DATABASE_URL: postgresql+psycopg://sociman_e2e:sociman_e2e@postgres:5432/sociman_e2e
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: "SociMan <nao-responda@sociman.local>"
  APP_URL: http://localhost:${E2E_EDGE_PORT:-8280}
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: sociman-e2e
  S3_SECRET_KEY: sociman-e2e-secret
  S3_BUCKET: sociman
  S3_FONTS_BUCKET: sociman-fonts
  S3_VIDEOS_BUCKET: sociman-videos
  # Fixo e público: só assina tokens da stack efêmera (não é segredo).
  JWT_SECRET: teste-e2e-efemero-nao-e-segredo-0123456789abcdef
  # HD de dados de mentira (volume tmpfs abaixo); piso baixo porque o tmpfs é pequeno.
  SOCIMAN_DATA_DIR: /srv/sociman-data
  DATA_MIN_FREE_GB: "0.01"
  TMPDIR: /srv/sociman-data/work/tmp
  PYTHONDONTWRITEBYTECODE: "1"
  UV_CACHE_DIR: /tmp/uv-cache   # UID 1000 não tem HOME gravável no container
  UV_NO_SYNC: "1"               # o venv (/opt/venv) já vem pronto da imagem

# Cria o sentinela e work/ no "HD" antes do comando (API e worker, idempotente).
x-data-entrypoint: &data-entrypoint
  - /bin/sh
  - -c
  - >
    mkdir -p "$$SOCIMAN_DATA_DIR/work/tmp" "$$SOCIMAN_DATA_DIR/work/cortes" &&
    echo e2e > "$$SOCIMAN_DATA_DIR/.sociman-volume" &&
    exec "$$@"
  - sh

# Spec 006: OpenShorts e YouTube apontam para o `openshorts-fake` (o e2e nunca chama o Google
# nem o OpenShorts real). A chave do YouTube é fixa e de mentira (não casa com `AIza…`); sem
# ANTHROPIC_API_KEY (a sugestão de textos é coberta pelo pytest). Só `api` e `agendador`.
x-integracoes-env: &integracoes-env
  OPENSHORTS_URL: http://openshorts-fake:8000
  YOUTUBE_API_URL: http://openshorts-fake:8000/youtube/v3
  YOUTUBE_API_KEY: chave-youtube-de-mentira-do-e2e
  APP_TZ: America/Sao_Paulo
  # Spec 008 (T015): o Claude também é o `openshorts-fake` (`POST /v1/messages`). A chave é fixa
  # e de mentira (não casa com `sk-ant-…`); o e2e nunca chama a Anthropic.
  ANTHROPIC_API_KEY: chave-claude-de-mentira-do-e2e
  ANTHROPIC_BASE_URL: http://openshorts-fake:8000

# Spec 015 (T039): a TikTok também é o `openshorts-fake` (`/tiktok/v2/...`, partes e avatar no
# mesmo host). Chave dos tokens e client secret FIXOS de teste (liberados por valor no
# check:secrets); PUBLICACAO_HABILITADA=true SÓ aqui. O login do navegador é interceptado pelo
# Playwright (volta com `code=e2e-<handle>`). Os hosts reais da TikTok apontam para 127.0.0.1
# (`extra_hosts` abaixo): um pedido que escapasse do fake não sairia da máquina.
x-tiktok-env: &tiktok-env
  TIKTOK_CLIENT_KEY: e2e-client-key-de-teste
  TIKTOK_CLIENT_SECRET: e2e-client-secret-de-teste
  SOCIMAN_TOKENS_KEY: ZTJlLWVmZW1lcm8tY2hhdmUtZG9zLXRva2Vucy0zMmI=
  PUBLICACAO_HABILITADA: "true"
  TIKTOK_APP_SITUACAO: sandbox
  TIKTOK_API_URL: http://openshorts-fake:8000/tiktok
  TIKTOK_UPLOAD_HOSTS: openshorts-fake
  TIKTOK_REDIRECT_WEB: https://192.168.86.47:${E2E_EDGE_TLS_PORT:-8643}/app/conexoes/retorno
  TIKTOK_REDIRECT_DESKTOP: http://localhost:${E2E_EDGE_PORT:-8280}/app/conexoes/retorno

x-tiktok-hosts: &tiktok-hosts
  - "open.tiktokapis.com:127.0.0.1"
  - "open-upload.tiktokapis.com:127.0.0.1"
  - "www.tiktok.com:127.0.0.1"

services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${E2E_EDGE_PORT:-8280}:8080"
      - "127.0.0.1:${E2E_EDGE_TLS_PORT:-8643}:8443"
    environment:
      EDGE_MODE: ${E2E_EDGE_MODE:-dev}
      LAN_HOST: 192.168.86.47   # o e2e do PWA simula o IP da casa pelo header Host
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/05-edge-mode.envsh:/docker-entrypoint.d/05-edge-mode.envsh:ro
      # Só os arquivos públicos/do edge, só leitura (a chave da CA fica de fora).
      - ./docker/certs/localhost.pem:/etc/nginx/certs/localhost.pem:ro
      - ./docker/certs/localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro
      - ./docker/certs/ca/sociman-ca.crt:/usr/share/nginx/ca/sociman-ca.crt:ro
      - ./docker/certs/ca/sociman-ca.cer:/usr/share/nginx/ca/sociman-ca.cer:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./apps/api
    image: sociman-api-e2e:latest   # a mesma tag no worker: um build serve os dois
    user: "1000:1000"
    environment:
      <<: [*api-env, *integracoes-env, *tiktok-env]
    extra_hosts: *tiktok-hosts
    volumes:
      - sociman-data:/srv/sociman-data
    entrypoint: *data-entrypoint
    command: ["sh", "start.sh"]   # migrations + uvicorn, sem --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # API e worker enxergam o MESMO data dir (upload em work/tmp, cortes em work/cortes).
  worker:
    image: sociman-api-e2e:latest
    user: "1000:1000"
    environment: *api-env
    volumes:
      - sociman-data:/srv/sociman-data
    entrypoint: *data-entrypoint
    command: ["sociman", "worker"]
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy   # a API aplica as migrations

  # Spec 006: OpenShorts falso que também responde /youtube/v3/* (e2e/fakes/server.py, só
  # stdlib; a imagem da API já tem o ffmpeg para gerar os clipes sintéticos na subida).
  openshorts-fake:
    image: sociman-api-e2e:latest
    user: "1000:1000"
    entrypoint: ["python", "/fake/server.py"]
    volumes:
      - ./e2e/fakes:/fake:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 60
    depends_on:
      api:
        condition: service_started   # só para o build da imagem vir antes

  # Spec 006: as trilhas do `sociman agendador` com intervalos curtos, no mesmo "HD" da API.
  agendador:
    image: sociman-api-e2e:latest
    user: "1000:1000"
    environment:
      <<: [*api-env, *integracoes-env, *tiktok-env]
      AGENDADOR_SYNC_S: "2"
      AGENDADOR_OPENSHORTS_S: "1"
      AGENDADOR_IMPORTACAO_S: "1"
      AGENDADOR_LEMBRETES_S: "2"
      AGENDADOR_PUBLICACAO_S: "2"
    extra_hosts: *tiktok-hosts
    volumes:
      - sociman-data:/srv/sociman-data
    entrypoint: *data-entrypoint
    command: ["sociman", "agendador"]
    stop_grace_period: 10s
    depends_on:
      api:
        condition: service_healthy   # a API aplica as migrations
      openshorts-fake:
        condition: service_healthy

  web:
    image: node:22-bookworm
    profiles: ["dev"]
    working_dir: /repo
    user: "1000:1000"
    environment:
      HOME: /tmp
      VITE_CACHE_DIR: /tmp/vite-cache-e2e   # dentro do container: não disputa com o web do dev
    volumes:
      - .:/repo
    command: ["npm", "run", "dev", "-w", "@sociman/web", "--", "--host"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 90

  web-prod:
    image: nginx:1.27-alpine
    profiles: ["pwa"]
    volumes:
      # Build próprio do e2e (o update.spec o reconstrói): nunca o apps/web/dist do modo casa.
      - ${E2E_WEB_DIST:-./.e2e/pwa-dist}:/usr/share/nginx/html:ro
      - ./docker/nginx/web-prod.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sociman_e2e
      POSTGRES_PASSWORD: sociman_e2e
      POSTGRES_DB: sociman_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociman_e2e -d sociman_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${E2E_MAILPIT_PORT:-8127}:8025"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e   # a mesma do dev
    command: server /data
    environment:
      MINIO_ROOT_USER: sociman-e2e
      MINIO_ROOT_PASSWORD: sociman-e2e-secret
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set e2e http://minio:9000 sociman-e2e sociman-e2e-secret &&
        mc mb -p e2e/sociman e2e/sociman-fonts e2e/sociman-videos
    depends_on:
      minio:
        condition: service_healthy

  # Thumbnails em /img/* — fontes RESTRITAS ao bucket
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: sociman-e2e
      AWS_SECRET_ACCESS_KEY: sociman-e2e-secret
      IMGPROXY_ALLOWED_SOURCES: "s3://sociman/"
      IMGPROXY_MAX_SRC_RESOLUTION: "40"   # spec 007, R3 (igual ao dev)
    depends_on:
      minio:
        condition: service_healthy

volumes:
  # "HD de dados" compartilhado por API e worker, em RAM (some no `down -v`).
  sociman-data:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1g,uid=1000,gid=1000,mode=0755"
