[project]
name = "sociman-coletor"
version = "0.1.0"
description = "SociMan — coletor de mercado: navega no Chrome do dono em ritmo humano e devolve o que viu pela API de ingestão (spec 026)"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50",
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.scripts]
sociman-coletor = "sociman_coletor.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sociman_coletor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "navegador: precisa do Chromium do Playwright (pulado quando não há navegador disponível)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
